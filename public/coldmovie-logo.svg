  <text x="98" y="64" fill="#B8BBC7" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" letter-spacing="2.6">FROZEN CINEMA CATALOG</text>
  <path d="M96 52H323" stroke="url(#underline)" stroke-width="2" stroke-linecap="round"/>

  <defs>
    <linearGradient id="frameStroke" x1="7" y1="11" x2="75" y2="79" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9D7FF"/>
      <stop offset=".28" stop-color="#FFFFFF"/>
      <stop offset=".58" stop-color="#1877f2"/>
      <stop offset="1" stop-color="#72a8ff"/>
    </linearGradient>
    <linearGradient id="hotFill" x1="56" y1="28" x2="89" y2="63" gradientUnits="userSpaceOnUse">
