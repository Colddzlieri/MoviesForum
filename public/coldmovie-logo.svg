    <path d="M27.5 45C27.5 34.7 35.2 27.2 45.8 27.2C52 27.2 57.1 29.8 60.5 34.3L52.8 40.9C51.2 38.7 49 37.5 46.1 37.5C41.3 37.5 38.2 40.6 38.2 45C38.2 49.6 41.3 52.8 46.1 52.8C49.1 52.8 51.4 51.4 53.1 49.1L60.8 55.6C57.4 60.4 52.2 63.1 45.8 63.1C35.2 63.1 27.5 55.4 27.5 45Z" fill="#F8FBFF"/>
